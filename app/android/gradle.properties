org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Compilation Kotlin incrémentale coupée, et ce n'est pas un réglage de confort.
#
# Le cache des paquets Dart vit sur un autre volume que le dépôt sur ce poste,
# et le compilateur Kotlin ne sait pas calculer un chemin entre deux racines :
# il échoue à refermer ses caches, plugin par plugin. L'erreur existait déjà
# sous AGP 8, où elle n'était qu'un avertissement ; depuis Kotlin 2.4 elle fait
# échouer la tâche, donc le bundle entier. Le surcoût est nul en pratique — le
# Kotlin du projet tient en deux fichiers, et celui des plugins ne change
# jamais, donc Gradle saute ces tâches déjà à jour.
kotlin.incremental=false
