name: deckhand
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.13.1+26

environment:
  # **Relevée pour ML Kit 0.17**, qui exige Dart ^3.12.0. Dart 3.13.2 et
  # Flutter 3.47.2 sont installés — aucune montée d'outillage impliquée.
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Aucune ligne de DeckHand n'écrit `CupertinoIcons` — et pourtant elle reste.
  # Le retrait a été tenté : `flutter build web` avertit alors « Expected to
  # find fonts for (MaterialIcons, packages/cupertino_icons/CupertinoIcons) ».
  # La référence vient du framework lui-même, par les widgets Cupertino que
  # Flutter monte pour la sélection de texte ; chercher les occurrences dans
  # `lib/` et `test/` ne pouvait donc pas la voir.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  flutter_riverpod: ^3.3.2
  image: ^4.9.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  image_cropper: ^12.2.1
  speech_to_text: ^7.4.0
  # **Remontée en 0.17 après avoir trouvé la vraie cause.** La 0.17 avait été
  # publiée en 1.8.1+15 et l'OCR n'y lisait plus aucun nom ; tout le lot était
  # revenu en arrière faute de savoir lequel des trois suspects accusait.
  # `adb logcat` a tranché : ce n'était aucun des trois, mais R8 qui
  # supprimait les registrars de ML Kit — instanciés par réflexion, donc
  # invisibles pour lui. Les `-keep` sont dans
  # `android/app/proguard-rules.pro`, avec le journal qui les motive.
  #
  # **Ne pas remonter plus haut sans vérifier sur l'appareil.** ML Kit
  # n'existe nulle part ailleurs, et sa panne est muette : le pipeline
  # retombe sur l'illustration au lieu d'échouer.
  google_mlkit_text_recognition: ^0.17.1
  flutter_svg: ^2.3.0
  http: ^1.6.0

  # **Le compte, et ce que la loi et Google Play demandent autour.**
  # « Continuer avec Google » (Android) : un jeton d'identité échangé contre une
  # session Supabase — calqué sur DewDrop. **L'implémentation Android seule, et
  # non le paquet `google_sign_in`** : celui-ci embarque aussi sa version web,
  # qui charge le script de Google dès le démarrage — à chaque visite d'un
  # classeur partagé, l'adresse IP du visiteur partait chez Google. La version
  # web publiée ne connecte personne : elle n'a pas à l'embarquer.
  # `flutter_secure_storage` : la session dans le Keystore plutôt qu'en clair
  # dans les préférences (`secure_session_storage.dart`).
  # `url_launcher` : ouvrir la politique, les CGU et les mentions légales, qui
  # vivent sur le web — l'application n'en garde pas de copie qui divergerait.
  google_sign_in_android: ^7.2.17
  google_sign_in_platform_interface: ^3.1.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2

  # Le flux vidéo, pour le mode temps réel (issue #8). Le paquet ne sert qu'à
  # obtenir les plans d'une image ; la reconnaissance reste celle du mode photo,
  # au bit près — c'est la condition pour que l'index embarqué reste valide.
  camera: ^0.11.0
  # Le jingle de l'écran d'introduction, et lui seul. Le froissement des pages
  # du calque garde sa synthèse Web Audio : il n'existe que sur le web, où
  # `page_sound_wave.dart` le fabrique échantillon par échantillon sans rien
  # charger. L'intro, elle, doit sonner sur le téléphone — où ce moteur est
  # muet par conception — d'où un greffon natif pour un unique fichier.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Bancs qui s'exécutent **sur l'appareil**, seul endroit où ML Kit existe :
  # sans eux on ne mesure que la voie de l'empreinte, jamais la lecture du nom
  # dont le mode photo dépend d'abord. `path_provider` sert à trouver le dossier
  # externe de l'application — un chemin écrit en dur y échoue en silence depuis
  # Android 10. Dépendances de test : absentes des builds de production.
  integration_test:
    sdk: flutter
  path_provider: ^2.1.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # **Le jingle est de nous.** Les illustrations de cartes ne peuvent pas être
  # commitées (§IV.11, le dépôt est public) ; ce jingle est généré par
  # `tools/sounds/gen_intro_jingle.py`, qui le refait à l'identique. 49 Kio.
  assets:
    - assets/audio/deckhand_intro.mp3
    - assets/fonts/roboto/LICENSE.txt

  # **Roboto embarquée**, copiée du SDK Flutter (licence Apache 2.0, déclarée
  # au registre des licences dans `main.dart`). Sans elle, la version web tire
  # la police de `fonts.gstatic.com` à chaque visite, et transmet l'adresse IP
  # du visiteur d'un classeur partagé à Google sans son accord. Sur Android, elle
  # remplace la Roboto du système par la même police. Cinq styles : ceux que le
  # code emploie (300, 400, 500, 700, italique ; 600 se résout en 700).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/roboto-light.ttf
          weight: 300
        - asset: assets/fonts/roboto/roboto-regular.ttf
        - asset: assets/fonts/roboto/roboto-italic.ttf
          style: italic
        - asset: assets/fonts/roboto/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/roboto-bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
