# Publie le classeur partagé et les pages statiques sur GitHub Pages, sous
# `deckhand.heianenterprise.com` (domaine réglé dans les paramètres Pages du
# dépôt ; `app/web/CNAME` le rappelle). L'ancienne adresse
# `lelio88.github.io/DeckHand/` redirige, chemin et paramètres compris.
#
# **Les pages statiques voyagent avec le build.** Tout fichier de `app/web/`
# est copié tel quel par `flutter build web` : accueil, politique, CGU,
# mentions légales. Elles sont servies à côté de l'application, à la racine.
#
# **Ce qui est publié n'est pas l'application.** `DECKHAND_PUBLIC_ONLY` compile
# une variante qui ne sait que lire des classeurs partagés : ni connexion, ni
# inscription. L'inscription est ouverte sur le projet Supabase, et une adresse
# publique donnerait sinon à n'importe qui de quoi créer un compte — ce que
# `CLAUDE.md` §I dit ne pas vouloir. La clé publiable qu'emporte cette variante
# ne peut donc servir qu'à des lectures anonymes, bornées par les politiques.
#
# **Les clés viennent des secrets d'actions, jamais du dépôt** (§IV.7). Le
# résultat du build est envoyé comme artefact et n'atterrit sur aucune branche :
# rien de compilé n'entre dans l'historique.
#
# **Rien n'est tiré de chez Google pour s'afficher** : CanvasKit est embarqué
# (`--no-web-resources-cdn`) au lieu de venir de `www.gstatic.com`, la police
# Roboto l'est aussi (`app/pubspec.yaml`), et les polices de secours (noms de
# cartes en japonais ou en chinois, emoji) sont copiées au build dans
# `fonts/fallback/` (`tools/web/fallback_fonts.sh`), où `web/flutter_bootstrap.js`
# pointe le moteur. Chaque visite transmettait sinon l'adresse IP du visiteur à
# Google sans son accord.

name: Classeur partagé

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une plus récente annule celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dépendances
        working-directory: app
        run: flutter pub get

      # Ce qui est publié doit passer les tests : une page cassée est vue par
      # des inconnus avant de l'être par nous.
      - name: Tests
        working-directory: app
        run: flutter test

      - name: Compilation web
        working-directory: app
        run: >
          flutter build web --release
          --no-web-resources-cdn
          --dart-define=DECKHAND_PUBLIC_ONLY=true
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Polices de secours
        run: sh tools/web/fallback_fonts.sh app/build/web

      # La page de suppression de compte et celle du consentement d'un
      # assistant parlent à Supabase sans passer par Flutter : leur adresse et
      # leur clé publiable y sont posées ici, depuis les mêmes secrets. Une
      # marque restée en place ferait une page qui ne joint aucun serveur — la
      # compilation échoue plutôt.
      - name: Serveur des pages de compte
        working-directory: app/build/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          PAGES="suppression-compte.js suppression-compte.html oauth-consent.js oauth-consent.html"
          sed -i "s#__SUPABASE_URL__#${SUPABASE_URL}#g; s#__SUPABASE_PUBLISHABLE_KEY__#${SUPABASE_PUBLISHABLE_KEY}#g" $PAGES
          if grep -q "__SUPABASE_" $PAGES; then
            echo "marque de remplacement restée en place" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
